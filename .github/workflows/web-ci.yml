name: Web CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate SO-101 evidence boundaries
        run: npm run validate:so101

      - name: Validate research theses and evidence gates
        run: npm run validate:theses

      - name: Validate research program and registration safety
        run: npm run validate:research

      - name: Build
        run: npm run build
